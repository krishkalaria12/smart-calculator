[package]
name = "smart-calculator"
version = "1.0.2"
edition = "2024"
description = "Natural-language calculator for math, units, time zones, dates, fiat, and crypto conversions"
license = "MIT"
readme = "README.md"
repository = "https://github.com/krishkalaria12/smart-calculator"
homepage = "https://github.com/krishkalaria12/smart-calculator"
documentation = "https://docs.rs/smart-calculator"
keywords = ["calculator", "conversion", "currency", "parser", "math"]
categories = ["mathematics", "parser-implementations", "value-formatting"]

[dependencies]
async-trait = "0.1.89"
chrono = "0.4.44"
chrono-tz = "0.10.4"
fixed_decimal = { version = "0.7.1", features = ["ryu"] }
iana-time-zone = "0.1.65"
icu = "2.1.1"
iso_currency = "0.5.3"
papaya = "0.2.3"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
